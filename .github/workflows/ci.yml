name: DevOps Portfolio CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies
        run: dotnet restore ./DevOpsPortfolio.App

      - name: Build application
        run: dotnet build ./DevOpsPortfolio.App --configuration Release --no-restore

      - name: Smoke test
        run: |
          output=$(APP_ENV=production dotnet run --no-build --configuration Release --project ./DevOpsPortfolio.App)
          echo "$output"
          [[ "$output" == *"production"* ]]